# Reverse proxy for shopclock-admin, terminating TLS and routing a single
# domain to the admin container (:8080) and backend container (:3000).
#
# Replace "yourdomain.com" below, then obtain certs with:
#   certbot certonly --webroot -w /var/www/certbot -d yourdomain.com
#
# Matching env vars for docker-compose's .env:
#   NODE_ENV=production
#   ADMIN_FRONTEND_URL=https://yourdomain.com
#   ADMIN_API_BASE_URL=https://yourdomain.com/api
#   FLUXER_REDIRECT_URI=https://yourdomain.com/api/admin/auth/fluxer/callback

server {
  listen 80;
  listen [::]:80;
  server_name yourdomain.com;

  # certbot webroot challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name yourdomain.com;

  ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

  # backend API, stripped of the /api prefix
  location /api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # admin panel SPA
  location / {
    proxy_pass http://127.0.0.1:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
