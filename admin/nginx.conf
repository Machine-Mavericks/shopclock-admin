server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Also serve the same build under /sc/, for hosts (e.g. mDNS .local
  # domains) that can't use a dedicated subdomain for the admin panel.
  location /sc/ {
    alias /usr/share/nginx/html/;
    try_files $uri $uri/ /sc/index.html;
  }
}
